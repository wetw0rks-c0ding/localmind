name: build (reusable)

# Shared build/publish pipeline for all release channels.
# Called by nightly.yml, beta.yml and release.yml. Do not trigger directly.

on:
  workflow_call:
    inputs:
      channel:
        description: "Channel: nightly | beta | stable"
        type: string
        required: true
      tag:
        description: "Release tag. Empty for nightly/beta (derived automatically)."
        type: string
        default: ""
      prerelease:
        description: "Publish as a GitHub prerelease"
        type: boolean
        default: true
      retention:
        description: "Keep only this many releases in the channel (0 = keep all)"
        type: number
        default: 0
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve channel version
        id: v
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG_IN: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          base=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          base_name=${base%%+*}
          if [[ "$base" == *+* ]]; then base_code=${base#*+}; else base_code=0; fi
          date_utc=$(date -u +%Y%m%d)
          short_sha=${GITHUB_SHA::7}

          case "$CHANNEL" in
            stable)
              [[ -n "$TAG_IN" ]] || { echo "stable channel needs a tag"; exit 1; }
              name=${TAG_IN#v}
              if [[ "$name" == *+* ]]; then
                code=$(( ${name#*+} * 1000 ))
                name=${name%%+*}
              else
                code=$(( base_code * 1000 ))
              fi
              tag=${TAG_IN}
              title="LocalMind ${name}"
              ;;
            beta)
              name="${base_name}-beta.${GITHUB_RUN_NUMBER}"
              code=$(( base_code * 1000 + 100 + GITHUB_RUN_NUMBER % 100 ))
              tag="v${name}"
              title="LocalMind ${name} (beta)"
              ;;
            nightly)
              name="${base_name}-nightly.${date_utc}"
              code=$(( base_code * 1000 + 500 + GITHUB_RUN_NUMBER % 400 ))
              tag="nightly-${date_utc}-${short_sha}"
              title="LocalMind nightly ${date_utc} (${short_sha})"
              ;;
            *)
              echo "unknown channel: $CHANNEL"; exit 1;;
          esac

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code"   >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "Resolved: channel=$CHANNEL version=$name+$code tag=$tag"

      - name: Configure release signing (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter compact

      - name: Build APK
        env:
          NAME: ${{ steps.v.outputs.name }}
          CODE: ${{ steps.v.outputs.code }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="$NAME" \
            --build-number="$CODE"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/localmind-${NAME}-${CHANNEL}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Build App Bundle (stable only)
        if: ${{ inputs.channel == 'stable' }}
        env:
          NAME: ${{ steps.v.outputs.name }}
          CODE: ${{ steps.v.outputs.code }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name="$NAME" \
            --build-number="$CODE"
          cp build/app/outputs/bundle/release/app-release.aab \
             "dist/localmind-${NAME}.aab"
          sha256sum dist/*.aab >> dist/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localmind-${{ inputs.channel }}-${{ steps.v.outputs.name }}
          path: dist/
          retention-days: 7

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ steps.v.outputs.tag }}
          TITLE: ${{ steps.v.outputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
          CODE: ${{ steps.v.outputs.code }}
          NAME: ${{ steps.v.outputs.name }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "nightly" ]]; then
            git log -n 15 --pretty='- %h %s' > notes.md
            echo "" >> notes.md
            echo "Built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`." >> notes.md
          elif [[ "$CHANNEL" == "beta" ]]; then
            echo "Beta build of the next release. Please report issues." > notes.md
            echo "" >> notes.md
            git log -n 15 --pretty='- %h %s' >> notes.md
          else
            if [[ -f "release_message_sample.md" ]]; then
              cp release_message_sample.md notes.md
            else
              echo "Release ${NAME}" > notes.md
            fi
          fi

          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          if [[ "$CHANNEL" == "stable" ]]; then flags+=(--latest); fi

          target_args=()
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            target_args+=(--target "$GITHUB_SHA")
          fi

          gh release create "$TAG" dist/* \
            --title "$TITLE" \
            --notes-file notes.md \
            "${target_args[@]}" \
            "${flags[@]}"

      - name: Prune old releases in channel
        if: ${{ inputs.retention > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          RETENTION: ${{ inputs.retention }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            nightly) pattern='^nightly-' ;;
            beta)    pattern="-beta\\." ;;
            *)       exit 0 ;;
          esac
          gh release list --limit 100 --json tagName,createdAt \
            --jq ".[] | select(.tagName | test(\"$pattern\")) | .tagName" \
            | tail -n +$(( RETENTION + 1 )) \
            | while read -r tag; do
                [[ -n "$tag" ]] || continue
                echo "Deleting old release $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
